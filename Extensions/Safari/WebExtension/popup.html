<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Lumi 网页翻译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Laid out like Lumi's panel: the language chip in a 36pt header row,
       one glass control for the one thing you came to do, then the service
       rail. Safari's popover is the sheet, so nothing else here is glass. -->
  <header class="head">
    <label class="lang chip" title="译文语言">
      <span class="from">自动</span>
      <svg class="swap" viewBox="0 0 12 10" aria-hidden="true"><path d="M1 3h9M7.5 .8 10 3 7.5 5.2M11 7H2M4.5 4.8 2 7l2.5 2.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="to" id="target-name">简体中文</span>
      <select id="target" aria-label="译为"></select>
    </label>
    <span class="grow"></span>
    <span class="engine" id="engine"><i class="dot"></i><span>正在连接 Lumi…</span></span>
  </header>

  <button id="toggle" class="glass go" type="button" disabled>
    <span class="glyph" aria-hidden="true">文</span>
    <span class="go-label" id="toggle-label">翻译此页</span>
    <span class="go-meta" id="progress"></span>
    <kbd>⌥T</kbd>
  </button>

  <div class="rail" id="engines" role="radiogroup" aria-label="翻译引擎">
    <button type="button" role="radio" class="chip" data-engine="auto"><span>自动</span><i class="dot"></i></button>
    <button type="button" role="radio" class="chip" data-engine="online">
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .8 7.1 4.9 11.2 6 7.1 7.1 6 11.2 4.9 7.1.8 6l4.1-1.1z" fill="currentColor"/></svg>
      <span data-name>大模型</span><i class="dot"></i>
    </button>
    <button type="button" role="radio" class="chip" data-engine="offline">
      <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1.6" width="10" height="6.8" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4 10.8h4M6 8.5v2.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>本机</span><i class="dot"></i>
    </button>
    <button type="button" role="radio" class="chip" data-engine="google">
      <svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M1 6h10M6 1c1.6 1.5 2.3 3.2 2.3 5S7.6 9.5 6 11M6 1C4.4 2.5 3.7 4.2 3.7 6S4.4 9.5 6 11" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      <span>Google</span><i class="dot"></i>
    </button>
  </div>
  <p class="hint" id="engine-hint"></p>

  <section class="group">
    <div class="row">
      <span class="caption">译文样式</span>
      <div class="seg" id="styles" role="radiogroup" aria-label="译文样式">
        <i class="thumb" aria-hidden="true"></i>
        <button type="button" role="radio" data-style="pane" title="译文左侧一道细边">窗格</button>
        <button type="button" role="radio" data-style="clear" title="只用浅一点的字色区分">清晰</button>
        <button type="button" role="radio" data-style="frost" title="译文模糊，指上去才显示，适合练外语">磨砂</button>
        <button type="button" role="radio" data-style="replace" title="隐藏原文，指着译文可看原文">仅译文</button>
      </div>
    </div>
  </section>

  <section class="group" id="site" hidden>
    <label class="row switch-row">
      <span>总是翻译 <b id="host"></b></span>
      <input type="checkbox" class="switch" id="auto">
    </label>
    <label class="row switch-row">
      <span>在页面边缘显示 Lumi</span>
      <input type="checkbox" class="switch" id="dock">
    </label>
    <details id="notes-box">
      <summary class="row"><span>给模型的说明</span><svg class="chev" viewBox="0 0 8 12" aria-hidden="true"><path d="M2 1.5 6.5 6 2 10.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <textarea id="notes" rows="3" placeholder="这个网站讲什么、术语怎么译。例如：这是机器学习博客，attention 译作「注意力」，token 不译。"></textarea>
      <p class="hint">只对这个网站生效，只有大模型会读到。</p>
    </details>
  </section>

  <p class="blocked" id="blocked" hidden></p>

  <footer>在一段文字上轻点 <kbd>⌥</kbd>，只翻译那一段</footer>

  <script src="popup.js"></script>
</body>
</html>
